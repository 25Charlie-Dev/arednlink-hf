name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOFLAGS: -buildvcs=false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read release pins
        run: |
          pins=platforms/aredn/package/release.env
          for key in RELEASE_TAG PACKAGE_VERSION BINARY_VERSION BINARY_SHA256; do
            value=$(sed -n "s/^${key}=//p" "$pins")
            [ -n "$value" ] || { echo "missing $key"; exit 1; }
            echo "$key=$value" >> "$GITHUB_ENV"
          done

      - name: Tag must match the pins and carry a valid signature from the repository owner
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
        run: |
          [ "$TAG" = "$RELEASE_TAG" ] || { echo "tag $TAG does not match pinned $RELEASE_TAG"; exit 1; }
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          [ "$(git cat-file -t "$TAG")" = tag ] || { echo "tag must be annotated and signed"; exit 1; }
          email=$(git for-each-ref --format='%(taggeremail:trim)' "refs/tags/$TAG")
          gh api "users/$OWNER/ssh_signing_keys" --jq '.[].key' \
            | while read -r type key _; do printf '%s namespaces="git" %s %s\n' "$email" "$type" "$key"; done \
            > "$RUNNER_TEMP/allowed_signers"
          [ -s "$RUNNER_TEMP/allowed_signers" ] || { echo "owner has no signing keys"; exit 1; }
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/allowed_signers" tag -v "$TAG"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.11"
          cache: false

      - name: Build the ARMv7 binary and compare with the pinned hash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -tags 'kiss js8call' -trimpath \
            -ldflags "-s -w -X main.version=$BINARY_VERSION" -o dist/arednlink-hf-armv7 ./cmd/arednlink-hf
          actual=$(sha256sum dist/arednlink-hf-armv7 | cut -d' ' -f1)
          echo "built $actual, pinned $BINARY_SHA256"
          [ "$actual" = "$BINARY_SHA256" ] || { echo "binary does not reproduce the pinned hash"; exit 1; }

      - name: Build and check the APK
        run: |
          docker build -t apk-tools -f platforms/aredn/package/apk-tools.Dockerfile platforms/aredn/package
          mkdir -p "$RUNNER_TEMP/input" "$RUNNER_TEMP/out"
          install -m 0755 dist/arednlink-hf-armv7 "$RUNNER_TEMP/input/arednlink-hf"
          docker run --rm --network none -v "$PWD:/src:ro" -v "$RUNNER_TEMP/input:/input:ro" \
            -v "$RUNNER_TEMP/out:/out" apk-tools bash /src/platforms/aredn/package/check-package.sh
          cp "$RUNNER_TEMP/out/arednlink-hf-$PACKAGE_VERSION.apk" dist/

      - name: Install the SBOM generator
        run: GOBIN="$RUNNER_TEMP/bin" go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0

      - name: Generate the SBOM
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
          GOFLAGS: -tags=kiss,js8call
        run: |
          "$RUNNER_TEMP/bin/cyclonedx-gomod" app -json -std -licenses -assert-licenses \
            -main cmd/arednlink-hf -output "$RUNNER_TEMP/sbom.json" .
          # The license text is version-agnostic; the project is GPL-2.0-only.
          jq '.metadata.component.licenses = [{"license": {"id": "GPL-2.0-only"}}]' \
            "$RUNNER_TEMP/sbom.json" > "dist/arednlink-hf-$PACKAGE_VERSION.cdx.json"

      - name: Vulnerability exploitability statement (OpenVEX)
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          GOOS=linux GOARCH=arm GOARM=7 "$RUNNER_TEMP/bin/govulncheck" -tags kiss,js8call -format openvex ./... \
            > "dist/arednlink-hf-$PACKAGE_VERSION.openvex.json"
          jq -r '.statements[]? | "\(.vulnerability.name) \(.status) \(.justification // "")"' \
            "dist/arednlink-hf-$PACKAGE_VERSION.openvex.json"

      - name: Checksums
        working-directory: dist
        run: sha256sum arednlink-hf-* > SHA256SUMS && cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/arednlink-hf-armv7
            dist/arednlink-hf-${{ env.PACKAGE_VERSION }}.apk

      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/arednlink-hf-armv7
          sbom-path: dist/arednlink-hf-${{ env.PACKAGE_VERSION }}.cdx.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --prerelease --title "$TAG" \
            --notes "Unsigned APK for armv7 AREDN nodes; install with apk add --allow-untrusted. Verify downloads with SHA256SUMS or gh attestation verify. The .cdx.json file is the CycloneDX SBOM; the .openvex.json file states which known Go vulnerabilities affect this build." \
            dist/*
