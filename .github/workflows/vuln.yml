name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: none, tags: "" }
          - { label: kiss-js8call, tags: "kiss,js8call" }
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.11"
          cache: false
      - name: Install govulncheck
        run: GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan the ARMv7 daemon build
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
        run: '"$RUNNER_TEMP/bin/govulncheck" -tags "${{ matrix.tags }}" ./...'
